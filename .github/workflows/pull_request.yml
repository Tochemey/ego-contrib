name: pull_request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The token only needs to read the repository: nothing in these jobs writes back to GitHub
permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the action lists the commits of the pull request
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  lint:
    runs-on: ubuntu-latest
    env:
      # go.work only serves local development: modules are linted one at a time with their vendored dependencies
      GOWORK: off
    strategy:
      fail-fast: false
      matrix:
        module:
          - eventstore/memory
          - eventstore/postgres
          - durablestore/dynamodb
          - durablestore/cassandra
          - durablestore/postgres
          - durablestore/memory
          - offsetstore/memory
          - offsetstore/postgres
          - snapshotstore/postgres
          - eventstore/sqlite
          - durablestore/sqlite
          - offsetstore/sqlite
          - snapshotstore/sqlite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      - name: Vendor dependencies
        working-directory: ${{ matrix.module }}
        run: go mod vendor
      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: ${{ matrix.module }}
          args: --timeout 10m

  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    strategy:
      fail-fast: false
      matrix:
        module:
          - eventstore/memory
          - eventstore/postgres
          - durablestore/dynamodb
          - durablestore/cassandra
          - durablestore/postgres
          - durablestore/memory
          - offsetstore/memory
          - offsetstore/postgres
          - snapshotstore/postgres
          - eventstore/sqlite
          - durablestore/sqlite
          - offsetstore/sqlite
          - snapshotstore/sqlite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      - name: Run Tests
        run: make test/${{ matrix.module }}
